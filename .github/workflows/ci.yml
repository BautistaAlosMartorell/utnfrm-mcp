name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: ['22.13', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run verify
      - name: Prepare Linux Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-tools gnome-keyring dbus dbus-x11
      - name: Verify native Linux session encryption
        if: runner.os == 'Linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/utn-mcp-keyring
        run: |
          mkdir -p "$XDG_DATA_HOME"
          dbus-run-session -- bash -e -c '
            printf %s utn-mcp-ci-only | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            npm run build
            npm run test:keyring
          '
      - name: Build and verify native session encryption
        if: runner.os != 'Linux'
        run: npm run build
      - name: Verify native session encryption
        if: runner.os != 'Linux'
        run: npm run test:keyring
      - run: npm run install:browser
      - run: npm run package:check
